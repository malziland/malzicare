# Hält die Entwicklungswerkzeuge aktuell.
#
# ACHTUNG: Die beiden Bibliotheken in public/js/vendor/ sieht Dependabot NICHT -
# sie stehen bewusst nicht in package.json, weil sie unveraendert an den Browser
# gehen (ADR-0004). Dafuer prueft `node tools/fremdcode.mjs --neuigkeiten`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      werkzeuge:
        patterns: ['*']
    commit-message:
      prefix: 'Abhaengigkeiten'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'Pipeline'
