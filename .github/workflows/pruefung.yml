name: Pruefung

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nur lesen. Die Auslieferung laeuft nicht ueber die Pipeline, sondern
# bewusst von Hand aus dem Arbeitsverzeichnis - dort liegen die Zugangsdaten.
permissions:
  contents: read

concurrency:
  group: pruefung-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefung:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Gesperrter Modus: es wird genau das installiert, was im Lockfile steht.
      - name: Abhaengigkeiten
        run: npm ci --no-fund --no-audit

      - name: Testbrowser
        run: npx playwright install --with-deps chromium webkit

      - name: Pruefkette
        run: npm run verify

      # Ein bekannter Schwachpunkt ist keine Ausrede: die Frist richtet sich
      # nach dem Schweregrad, weggeschaut wird nicht.
      - name: Abhaengigkeiten pruefen
        run: npm audit --audit-level=high

      - name: Spuren bei Fehlschlag
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-bericht
          path: |
            playwright-report/
            test-results/
          retention-days: 7
